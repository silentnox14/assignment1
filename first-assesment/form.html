<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alt sch registration</title>
</head>
<body>
    <header>
        <h1>Alt Sch</h1>
        <hr>
        <nav>
            <ul>
                <li><a href="index.html">student Biography</a></li>
            </ul>
        </nav>
        <h1>Sign Up</h1>
        <p>create an account to get started on your learning journey</p>
    </header>
    <main>
        <form action="https://httpbin.org/get" method="get">
            <P>
                <label for="mail">Email</label>
                <input type="email" name="mail" id="mail" placeholder="jon.doe@example.com" autocomplete="on" required>
            </P>

            <P>
                <label for="firstName">First name</label>
                <input type="text" name="firstName" id="firstName" placeholder="john" autocomplete="on" required>
            </P>

            <P>
                <label for="lastName">Last name</label>
                <input type="text" name="lastName" id="lastName" placeholder="doe" autocomplete="on" required>
            </P>
            <P>
                <label for="phoneNumber">Phone number</label>
                <input type="tel" name="phoneNumber" id="phoneNumber" placeholder="+1234567890" pattern="[0-9]{3}[0-9]{3}[0-9]{4}" autocomplete="on" required>
            </P>

            <p>
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="*********" required >
            </p>
            <p>By clicking create account, i agree to terms of use and acknowledge that i have read the privacy policy</p>

            <button>Create account</button>
            <p>or</p>
            <button>login with Google</button>
        </form>
    </main>
<footer>

</footer>
   
</body>
</html>
